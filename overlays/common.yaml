# Overlay applied to the spec for every SDK (OpenAPI Overlay 1.0).
#
# Only two kinds of action belong here, each marked so it can be removed later:
#   UPSTREAM:       the spec is wrong or missing something; fix it in
#                   p2-inc/phasetwo-docs and delete the action once that merges.
#   GENERATOR BUG:  works around an openapi-generator bug; recheck on each upgrade.
# SDK-only choices belong in languages/<lang>/overlay.yaml instead.
overlay: 1.0.0
info:
  title: Phase Two SDK overlay (all languages)
  version: 1.0.0
actions:
  # GENERATOR BUG (7.27, jaxrs-spec and typescript-fetch): the inline schema for the
  # multipart variant of /orgs/import is imported as ImportOrganizationsRequest but
  # never generated, so the build fails. The SDKs send JSON, so drop the multipart
  # variant. Remove this once openapi-generator fixes it (check on each upgrade).
  - target: $.paths['/{realm}/orgs/import'].post.requestBody.content['multipart/form-data']
    remove: true
